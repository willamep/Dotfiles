source = ~/.cache/wal/colors-hyprland

monitor = auto, 3840x2160@60, 0x0, 1.5

$terminal = kitty
$fileManager = thunar
$browser = flatpak run app.zen_browser.zen
$menu = wofi --show drun -n
# $menu = wofi -n
exec-once = hypridle
exec-once = waybar
exec-once = swww-daemon --format xrgb && swww restore
exec-once = swaync
exec-once = pypr
# exec-once = swaync-client -df
exec-once = pactl set-sink-mute @DEFAULT_SINK@ 0
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
env = AQ_DRM_DEVICES,/dev/dri/card2
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

general { 
    gaps_in = 2
    gaps_out = 10
    border_size = 0
    col.active_border = $color9
    col.inactive_border = $color5
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}
decoration {
    rounding = 10
    active_opacity = 0.78
    inactive_opacity = 0.7
    fullscreen_opacity = 1
    blur {
        enabled = true
        size = 3
        passes = 5
        new_optimizations = true
        ignore_opacity = true
        xray = false
        popups = true
    }
    shadow {
        enabled = true
        range = 15
        render_power = 5
        color = rgba(0,0,0,.5)
    }
}
animations {
    enabled = true
    bezier = fluid, 0.15, 0.85, 0.25, 1
    bezier = snappy, 0.3, 1, 0.4, 1
    animation = windows, 1, 3, fluid, popin 5%
    animation = windowsOut, 1, 2.5, snappy
    animation = fade, 1, 4, snappy
    animation = workspaces, 1, 1.7, snappy, slide
    animation = specialWorkspace, 1, 4, fluid, slidefadevert -35%
    animation = layers, 1, 2, snappy, popin 70%
}
dwindle {
    preserve_split = true
}
misc { 
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    focus_on_activate = true
}
input {
    kb_layout = us, ru # Раскладка
    kb_options = grp:caps_toggle
    follow_mouse = 1 # Означает, что фокус окна меняется сразу, как только курсор на него наводится.
    sensitivity = 0 # Скорость мыши [-1; 1]
}
xwayland {
    force_zero_scaling = true
}


#------------------------------------------------#
#                launch Applications             #
#------------------------------------------------#
$mainMod = SUPER

# Подключаем среды и воркспейсы
source = ~/.config/hypr/workenv.conf

bindu = $mainMod, Return, exec, $terminal
bindu = $mainMod, Q, killactive
bindu = $mainMod, E, exec, $fileManager
bindu = $mainMod, B, exec, $browser
bindu = $mainMod, T, exec, Telegram

# Window Management
bindu = $mainMod, V, exec, hyprctl --batch "dispatch togglefloating; dispatch resizeactive exact 800 800; dispatch centerwindow 1;"
# bind = $mainMod, V, togglefloating 
bindu = $mainMod, W, exec, $menu
bindu = $mainMod, P, pseudo
bindu = $mainMod, O, togglesplit
bindu = $mainMod, F, fullscreen

# Focus (moving the cursor between windows)
bindu = $mainMod, H, movefocus, l
bindu = $mainMod, L, movefocus, r
bindu = $mainMod, K, movefocus, u
bindu = $mainMod, J, movefocus, d

# Moving the windows themselves (ALT + arrows)
bindu = ALT, H, movewindow, l
bindu = ALT, L, movewindow, r
bindu = ALT, K, movewindow, u
bindu = ALT, J, movewindow, d

# Switch between the last 2 workspace
bindu = $mainMod, TAB, workspace, previous

# Switch to the workspace with mouse
bindu = $mainMod, mouse_down, workspace, +1
bindu = $mainMod, mouse_up, workspace, -1

# Moving a window to a workspace with mouse
bindu = $mainMod SHIFT, mouse_down, movetoworkspace, r+1
bindu = $mainMod SHIFT, mouse_up, movetoworkspace, r-1

# Volume
bindelu = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindelu = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindelu = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindelu = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindelu = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindelu = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Player
bindlu = , XF86AudioNext, exec, playerctl next
bindlu = , XF86AudioPause, exec, playerctl play-pause
bindlu = , XF86AudioPlay, exec, playerctl play-pause
bindlu = , XF86AudioPrev, exec, playerctl previous

# Screenshots
bindu = , Print, exec, hyprshot -m region --clipboard-only          		# Область в буфер
bindu = SHIFT, Print, exec, hyprshot -m region -o ~/Pictures/03-ScreenShots/     # Область в файл
bindu = CTRL, Print, exec, hyprshot -m window --clipboard-only	# Окно
bindu = SHIFTCTRL, Print, exec, hyprshot -m window -o ~/Pictures/03-ScreenShots/
bindu = ALT, Print, exec, hyprshot -m active -m output --clipboard-only	# Весь монитор
bindu = SHIFTALT, Print, exec, hyprshot -m active -m output -o ~/Pictures/03-ScreenShots/

# Hyprland
bindu = $mainMod, M, exec, hyprlock            # Win+L -> Блокировка

# Scratchpads (Pyprland)
bindu = $mainMod, SPACE, exec, pypr toggle term     # Win+Space -> Терминал "выпадашка"
bindu = $mainMod, G, exec, pypr toggle music        # Win+G -> Музыка
# bind = $mainMod, T, exec, pypr toggle taskbar      # Win+T -> Таскбар (зачем?)

# Magic Workspace (Встроенный scratchpad Hyprland)
bindu = $mainMod, S, togglespecialworkspace, magic
bindu = $mainMod SHIFT, S, movetoworkspace, special:magic

# Custom HotKeys

# Castom Scripts
# bind = ALT, TAB, exec, wlogout -b 2
# bind = ALT, w, exec, ~/.config/hypr/wallpaper.sh
# bind = ALT, a, exec, ~/.config/waybar/scripts/refresh.sh 
# bind = ALT, B, exec, ~/.config/waybar/scripts/select.sh
# bind = ALT, r, exec, ~/.config/swaync/refresh.sh

# Visual Effects
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace waybar

layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0, match:namespace swaync-control-center
layerrule = ignore_alpha 0, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = ignore_alpha 0.5, match:namespace swaync-notification-window
layerrule = no_anim on, match:namespace selection
