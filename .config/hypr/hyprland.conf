source = ~/.cache/wal/colors-hyprland
source = ~/.config/hypr/app-opacity.conf

render = 
    force_32bpc = true
    explicit_sync = 1

monitor = DP-1, 3840x2160@60, 0x0, 1.5
# monitor = DP-1, 2560x1440@60, 0x0, 1
# monitor = DP-1, 2048x1280@60, 0x0, 1

$terminal = kitty
$fileManager = nautilus
$browser = flatpak run app.zen_browser.zen
$menu = wofi --show drun -n
# $menu = wofi -n
exec-once = hypridle
exec-once = waybar
exec-once = awww-daemon
exec-once = swaync
exec-once = pypr
# exec-once = swaync-client -df
exec-once = pactl set-sink-mute @DEFAULT_SINK@ 0
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
env = AQ_DRM_DEVICES,/dev/dri/card0
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

general { 
    gaps_in = 2
    gaps_out = 10
    border_size = 0
    col.active_border = $color9
    col.inactive_border = $color5
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}
decoration {
    rounding = 10
    active_opacity = 0.78
    inactive_opacity = 0.7
    fullscreen_opacity = 1
    blur {
        enabled = true
        size = 3
        passes = 5
        new_optimizations = true
        ignore_opacity = true
        xray = false
        popups = true
    }
    shadow {
        enabled = true
        range = 15
        render_power = 5
        color = rgba(0,0,0,.5)
    }
}
animations {
    enabled = true
    bezier = fluid, 0.15, 0.85, 0.25, 1
    bezier = snappy, 0.3, 1, 0.4, 1
    animation = windows, 1, 3, fluid, popin 5%
    animation = windowsOut, 1, 2.5, snappy
    animation = fade, 1, 4, snappy
    animation = workspaces, 1, 1.7, snappy, slide
    animation = specialWorkspace, 1, 4, fluid, slidefadevert -35%
    animation = layers, 1, 2, snappy, popin 70%
}
dwindle {
    preserve_split = true
}
debug {
    disable_logs = false
    # опционально для отладки OpenGL:
    # gl_debugging = true 
}

misc { 
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    focus_on_activate = true
}
input {
    # macOS-compatible English and Russian layouts.
    # Right Alt works as Option for additional characters.
    kb_layout = us,ru
    kb_variant = mac,mac
    # Physical Win/Command becomes Control for application shortcuts.
    # Physical Control becomes Super and is translated back inside Kitty.
    kb_options = grp:caps_toggle,ctrl:swap_lwin_lctl,ctrl:swap_rwin_rctl
    follow_mouse = 1 # Означает, что фокус окна меняется сразу, как только курсор на него наводится.
    sensitivity = 0 # Скорость мыши [-1; 1]
}
xwayland {
    force_zero_scaling = true
}


#------------------------------------------------#
#                launch Applications             #
#------------------------------------------------#
# Left Option controls Hyprland. Right Option remains available for
# additional characters provided by the Macintosh XKB layouts.
$mainMod = ALT
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, T, exec, Telegram

# macOS-style deletion in every application. Because Command is exposed as
# Control by XKB, CTRL+Backspace below means physical Command+Backspace.
bind = ALT, BackSpace, exec, ~/.config/hypr/scripts/macos-delete.sh word
bind = CTRL, BackSpace, exec, ~/.config/hypr/scripts/macos-delete.sh line

# Forward the physical Control key (exposed as SUPER by XKB) to the focused
# application. Physical keycodes keep these shortcuts independent of layout.
bind = SUPER, code:38, exec, ~/.config/hypr/scripts/forward-control.sh A
bind = SUPER, code:56, exec, ~/.config/hypr/scripts/forward-control.sh B
bind = SUPER, code:54, exec, ~/.config/hypr/scripts/forward-control.sh C
bind = SUPER, code:40, exec, ~/.config/hypr/scripts/forward-control.sh D
bind = SUPER, code:26, exec, ~/.config/hypr/scripts/forward-control.sh E
bind = SUPER, code:41, exec, ~/.config/hypr/scripts/forward-control.sh F
bind = SUPER, code:42, exec, ~/.config/hypr/scripts/forward-control.sh G
bind = SUPER, code:43, exec, ~/.config/hypr/scripts/forward-control.sh H
bind = SUPER, code:31, exec, ~/.config/hypr/scripts/forward-control.sh I
bind = SUPER, code:44, exec, ~/.config/hypr/scripts/forward-control.sh J
bind = SUPER, code:45, exec, ~/.config/hypr/scripts/forward-control.sh K
bind = SUPER, code:46, exec, ~/.config/hypr/scripts/forward-control.sh L
bind = SUPER, code:58, exec, ~/.config/hypr/scripts/forward-control.sh M
bind = SUPER, code:57, exec, ~/.config/hypr/scripts/forward-control.sh N
bind = SUPER, code:32, exec, ~/.config/hypr/scripts/forward-control.sh O
bind = SUPER, code:33, exec, ~/.config/hypr/scripts/forward-control.sh P
bind = SUPER, code:24, exec, ~/.config/hypr/scripts/forward-control.sh Q
bind = SUPER, code:27, exec, ~/.config/hypr/scripts/forward-control.sh R
bind = SUPER, code:39, exec, ~/.config/hypr/scripts/forward-control.sh S
bind = SUPER, code:28, exec, ~/.config/hypr/scripts/forward-control.sh T
bind = SUPER, code:30, exec, ~/.config/hypr/scripts/forward-control.sh U
bind = SUPER, code:55, exec, ~/.config/hypr/scripts/forward-control.sh V
bind = SUPER, code:25, exec, ~/.config/hypr/scripts/forward-control.sh W
bind = SUPER, code:53, exec, ~/.config/hypr/scripts/forward-control.sh X
bind = SUPER, code:29, exec, ~/.config/hypr/scripts/forward-control.sh Y
bind = SUPER, code:52, exec, ~/.config/hypr/scripts/forward-control.sh Z
bind = SUPER, code:65, exec, ~/.config/hypr/scripts/forward-control.sh space
bind = SUPER, code:34, exec, ~/.config/hypr/scripts/forward-control.sh bracketleft
bind = SUPER, code:51, exec, ~/.config/hypr/scripts/forward-control.sh backslash
bind = SUPER, code:35, exec, ~/.config/hypr/scripts/forward-control.sh bracketright
bind = SUPER, code:22, exec, ~/.config/hypr/scripts/forward-control.sh BackSpace
bind = SUPER, code:113, exec, ~/.config/hypr/scripts/forward-control.sh left
bind = SUPER, code:114, exec, ~/.config/hypr/scripts/forward-control.sh right
bind = SUPER, code:111, exec, ~/.config/hypr/scripts/forward-control.sh up
bind = SUPER, code:116, exec, ~/.config/hypr/scripts/forward-control.sh down

# Window Management
bind = $mainMod, V, exec, hyprctl --batch "dispatch togglefloating; dispatch resizeactive exact 800 800; dispatch centerwindow 1;"
# bind = $mainMod, V, togglefloating 
bind = $mainMod, W, exec, $menu
bind = $mainMod, P, pseudo
bind = $mainMod, O, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen

# Per-application opacity (changes the focused application and remembers it)
bind = $mainMod CTRL, minus, exec, ~/.config/hypr/scripts/app-opacity.sh decrease
bind = $mainMod CTRL, equal, exec, ~/.config/hypr/scripts/app-opacity.sh increase
bind = $mainMod CTRL, 0, exec, ~/.config/hypr/scripts/app-opacity.sh reset

# Focus (moving the cursor between windows)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move windows (Option + Shift + H/J/K/L)
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Switch between the last 2 workspace
bind = $mainMod, TAB, workspace, previous

# Switch to the previous/next workspace
bind = $mainMod, left, workspace, -1
bind = $mainMod, right, workspace, +1

# Switch to the workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Switch to the workspace with mouse
bind = $mainMod, mouse_down, workspace, +1
bind = $mainMod, mouse_up, workspace, -1

# Moving a window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Moving a window to a workspace with mouse
bind = $mainMod SHIFT, mouse_down, movetoworkspace, r+1
bind = $mainMod SHIFT, mouse_up, movetoworkspace, r-1

# Volume
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Player
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshots
bind = , Print, exec, hyprshot -m region --clipboard-only          		# Область в буфер
bind = SHIFT, Print, exec, hyprshot -m region -o ~/Pictures/03-ScreenShots/     # Область в файл
bind = CTRL, Print, exec, hyprshot -m window --clipboard-only	# Окно
bind = SHIFTCTRL, Print, exec, hyprshot -m window -o ~/Pictures/03-ScreenShots/
bind = ALT, Print, exec, hyprshot -m active -m output --clipboard-only	# Весь монитор
bind = SHIFTALT, Print, exec, hyprshot -m active -m output -o ~/Pictures/03-ScreenShots/

# Hyprland
bind = $mainMod, M, exec, hyprlock            # Option+M -> Блокировка

# Scratchpads (Pyprland)
bind = $mainMod, SPACE, exec, pypr toggle term     # Option+Space -> Терминал "выпадашка"
bind = $mainMod, G, exec, pypr toggle music        # Option+G -> Музыка
# bind = $mainMod, T, exec, pypr toggle taskbar      # Option+T -> Таскбар (зачем?)

# Magic Workspace (Встроенный scratchpad Hyprland)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Custom HotKeys

# Castom Scripts
# bind = ALT, TAB, exec, wlogout -b 2
# bind = ALT, w, exec, ~/.config/hypr/wallpaper.sh
# bind = ALT, a, exec, ~/.config/waybar/scripts/refresh.sh 
# bind = ALT, B, exec, ~/.config/waybar/scripts/select.sh
# bind = ALT, r, exec, ~/.config/swaync/refresh.sh

# Visual Effects
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace waybar

layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0, match:namespace swaync-control-center
layerrule = ignore_alpha 0, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = ignore_alpha 0.5, match:namespace swaync-notification-window
layerrule = no_anim on, match:namespace selection
