source = ~/.cache/wal/colors-hyprland

monitor = auto, 3840x2160@60, 0x0, 1.5

$terminal = kitty
$fileManager = thunar
$browser = flatpak run app.zen_browser.zen
$menu = wofi --show drun -n
# $menu = wofi -n
exec-once = hypridle
exec-once = waybar
exec-once = swww-daemon --format xrgb && swww restore
exec-once = swaync
exec-once = pypr
# exec-once = swaync-client -df
exec-once = pactl set-sink-mute @DEFAULT_SINK@ 0
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

general { 
    gaps_in = 2
    gaps_out = 10
    border_size = 0
    col.active_border = $color9
    col.inactive_border = $color5
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}
decoration {
    rounding = 10
    active_opacity = 0.78
    inactive_opacity = 0.7
    fullscreen_opacity = 1
    blur {
        enabled = true
        size = 3
        passes = 5
        new_optimizations = true
        ignore_opacity = true
        xray = false
        popups = true
    }
    shadow {
        enabled = true
        range = 15
        render_power = 5
        color = rgba(0,0,0,.5)
    }
}
animations {
    enabled = true
    bezier = fluid, 0.15, 0.85, 0.25, 1
    bezier = snappy, 0.3, 1, 0.4, 1
    animation = windows, 1, 3, fluid, popin 5%
    animation = windowsOut, 1, 2.5, snappy
    animation = fade, 1, 4, snappy
    animation = workspaces, 1, 1.7, snappy, slide
    animation = specialWorkspace, 1, 4, fluid, slidefadevert -35%
    animation = layers, 1, 2, snappy, popin 70%
}
dwindle {
    preserve_split = true
}
misc { 
    force_default_wallpaper = -1
    disable_hyprland_logo = true
    focus_on_activate = true
}
input {
    kb_layout = us, ru # Раскладка
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1 # Означает, что фокус окна меняется сразу, как только курсор на него наводится.
    sensitivity = 0 # Скорость мыши [-1; 1]
}

$mainMod = SUPER

# Launch Applications
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, W, killactive
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser
bind = $mainMod, T, exec, Telegram

# Window Management
bind = $mainMod, V, exec, hyprctl --batch "dispatch togglefloating; dispatch resizeactive exact 800 800; dispatch centerwindow 1;"
# bind = $mainMod, V, togglefloating 
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit
bind = $mainMod, F, fullscreen

# Focus (moving the cursor between windows)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Moving the windows themselves (ALT + arrows)
bind = ALT, H, movewindow, l
bind = ALT, L, movewindow, r
bind = ALT, K, movewindow, u
bind = ALT, J, movewindow, d

# Switch to the workspace
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Moving a window to a workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Volume
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Player
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshots
bind = , Print, exec, hyprshot -m region -c          				# Область в буфер
bind = SHIFT, Print, exec, hyprshot -m region -o ~/Pictures/03-ScreenShots/     # Область в файл
bind = CTRL, Print, exec, hyprshot -m window -c           # Окно
bind = SHIFTCTRL, Print, exec, hyprshot -m window -o ~/Pictures/03-ScreenShots/
bind = ALT, Print, exec, hyprshot -m active -m output -c  # Весь монитор
bind = SHIFTALT, Print, exec, hyprshot -m active -m output -o ~/Pictures/03-ScreenShots/

# Hyprland
# bind = $mainMod, l, exec, hyprlock            # Win+L -> Блокировка
bind = $mainMod, M, exit                      # Win+M -> Выход из Hyprland (логаут)

# Scratchpads (Pyprland)
bind = $mainMod, SPACE, exec, pypr toggle term     # Win+Space -> Терминал "выпадашка"
bind = $mainMod, G, exec, pypr toggle music        # Win+G -> Музыка
bind = $mainMod, T, exec, pypr toggle taskbar      # Win+T -> Таскбар (зачем?)

# Magic Workspace (Встроенный scratchpad Hyprland)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Custom HotKeys

# Castom Scripts
# bind = ALT, TAB, exec, wlogout -b 2
# bind = ALT, w, exec, ~/.config/hypr/wallpaper.sh
# bind = ALT, a, exec, ~/.config/waybar/scripts/refresh.sh 
# bind = ALT, B, exec, ~/.config/waybar/scripts/select.sh
# bind = ALT, r, exec, ~/.config/swaync/refresh.sh

# Visual Effects
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace waybar

layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0, match:namespace swaync-control-center
layerrule = ignore_alpha 0, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = ignore_alpha 0.5, match:namespace swaync-notification-window
layerrule = no_anim on, match:namespace selection
